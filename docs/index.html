<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04140E" id="meta-theme-color" />

  <!-- iOS Standalone Home Screen PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CoinLens" />
  <meta name="format-detection" content="telephone=no" />

  <title>CoinLens — Net Worth &amp; Money Plan</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Reusable SVG Definitions (Exact 3D Liquid Glass Coral 'C' + Emerald 'L' AppLogoIcon) -->
  <svg width="0" height="0" style="position:absolute;visibility:hidden" aria-hidden="true">
    <defs>
      <linearGradient id="cl-coralBrush" x1="0%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#F5A3B0" />
        <stop offset="50%" stop-color="#E38391" />
        <stop offset="100%" stop-color="#B84A5A" />
      </linearGradient>
      <linearGradient id="cl-emeraldBrush" x1="35%" y1="15%" x2="90%" y2="75%">
        <stop offset="0%" stop-color="#7CF5CC" />
        <stop offset="50%" stop-color="#34D399" />
        <stop offset="100%" stop-color="#1E7A5C" />
      </linearGradient>
      <g id="coinlens-logo-mark">
        <path d="M 77 60 A 38 42 0 1 0 77 24" fill="none" stroke="rgba(227, 131, 145, 0.18)" stroke-width="18" stroke-linecap="round"/>
        <path d="M 77 60 A 38 42 0 1 0 77 24" fill="none" stroke="url(#cl-coralBrush)" stroke-width="13" stroke-linecap="round"/>
        <path d="M 74 58 A 38 42 0 1 0 74 26" fill="none" stroke="rgba(255, 220, 226, 0.8)" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M 23 20 A 38 42 0 0 0 12 55" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 58 45 L 40 68 L 82 68" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 58 45 L 40 68 L 82 68" fill="none" stroke="url(#cl-emeraldBrush)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 58 45 L 40 68 L 82 68" fill="none" stroke="rgba(216, 255, 240, 0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="54" y="53" width="6.2" height="9" rx="2.8" fill="url(#cl-emeraldBrush)"/>
        <rect x="63" y="45" width="6.8" height="17" rx="2.8" fill="url(#cl-emeraldBrush)"/>
        <rect x="72.5" y="34" width="9.5" height="28" rx="4" fill="url(#cl-emeraldBrush)"/>
        <rect x="74" y="35.5" width="5.5" height="25" rx="3" fill="rgba(216, 255, 240, 0.75)"/>
      </g>
    </defs>
  </svg>

  <!-- Liquid Glass Ambient Background Layer (4 Radial Glow Orbs matching MainActivity.kt) -->
  <div id="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="ambient-orb orb-4"></div>
  </div>

  <!-- 1. Authentication Screen (Matches LoginScreen in MainActivity.kt) -->
  <section id="auth-screen" class="fullscreen-layer">
    <div class="auth-scroll-container">
      <div class="auth-card liquid-glass-orb">
        <div class="auth-logo-wrap">
          <svg class="app-logo-svg" viewBox="0 0 100 90" width="84" height="84">
            <use href="#coinlens-logo-mark" />
          </svg>
        </div>
        <h1 class="auth-brand-title">COINLENS</h1>
        <p class="auth-brand-subtitle">Smart Wealth &amp; Money Plan</p>

        <div id="auth-error-box" class="auth-error-banner hidden"></div>

        <form id="auth-form" class="auth-form" autocomplete="on" novalidate>
          <div class="input-group">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="input-group">
            <label for="auth-password">Password</label>
            <div class="password-field-wrap">
              <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" id="toggle-password-btn" class="icon-btn-inline" aria-label="Show or hide password">👁</button>
            </div>
          </div>

          <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <button type="button" id="auth-switch-mode-btn" class="btn-text-link">
          Don't have an account? <strong>Create Account</strong>
        </button>

        <div class="auth-divider"><span>OR</span></div>

        <button type="button" id="google-signin-btn" class="btn btn-outline btn-block">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <button type="button" id="guest-signin-btn" class="btn btn-tonal btn-block">
          Continue as Guest
        </button>

        <p class="auth-privacy-footer">
          By continuing, you agree to our <a href="privacy.html">Privacy Policy</a>
        </p>
      </div>
    </div>
  </section>

  <!-- 2. Biometric Lock Screen (Face ID / Touch ID via WebAuthn) -->
  <section id="biometric-screen" class="fullscreen-layer hidden">
    <div class="auth-scroll-container">
      <div class="auth-card liquid-glass-orb">
        <div class="auth-logo-wrap">
          <svg class="app-logo-svg" viewBox="0 0 100 90" width="76" height="76">
            <use href="#coinlens-logo-mark" />
          </svg>
        </div>
        <h2 class="auth-brand-title" style="font-size:1.35rem;letter-spacing:1px;">CoinLens Locked</h2>
        <p class="auth-brand-subtitle">Authenticate with Face ID or Touch ID to view your wealth</p>
        <button type="button" id="biometric-unlock-btn" class="btn btn-primary btn-block" style="margin-top:16px;">
          🔒 Unlock with Face ID / Passkey
        </button>
        <button type="button" id="biometric-signout-btn" class="btn-text-link" style="margin-top:12px;">
          Sign out &amp; use password instead
        </button>
      </div>
    </div>
  </section>

  <!-- 3. 5-Step Onboarding Setup Wizard (Matches OnboardingSetupScreen in MainActivity.kt) -->
  <section id="onboarding-screen" class="fullscreen-layer hidden">
    <div id="onboarding-container" class="onboarding-container"></div>
  </section>

  <!-- 4. Main App Shell (Floating Header Capsule + Scrollable Content + Sticky What-If Bar + Floating Dock) -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Floating Top Liquid Glass Header Capsule -->
    <header id="floating-header" class="floating-header liquid-glass-pill">
      <div class="header-left">
        <div class="header-logo-badge">
          <svg id="header-logo-svg" viewBox="0 0 100 90" width="30" height="30">
            <use href="#coinlens-logo-mark" />
          </svg>
        </div>
        <div class="header-titles">
          <div id="header-subtitle" class="header-subtitle">COINLENS • ALEX &amp; PARTNER</div>
          <div id="header-title" class="header-title">Total Wealth &amp; Summary</div>
        </div>
      </div>
      <div class="header-right">
        <span id="sync-status-dot" class="sync-dot synced" title="Cloud Synced"></span>
        <button type="button" id="wealth-visibility-btn" class="header-icon-btn" aria-label="Toggle privacy mask" title="Show/Hide Amounts">
          <svg id="eye-open-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="eye-closed-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Floating Live What-If Mini Banner (Shown when scrolled past trajectory chart in Scenario Simulator) -->
    <div id="whatif-floating-banner" class="whatif-floating-banner hidden"></div>

    <!-- Scrollable Screen Content Viewport -->
    <main id="main-scroll" class="main-scroll" tabindex="-1">
      <div id="screen-content" class="screen-content"></div>
    </main>

    <!-- Draggable Floating CoinBot AI Assistant Button & Expandable Window -->
    <button type="button" id="ai-fab-btn" class="ai-fab-btn liquid-glass-orb" aria-label="Open CoinBot AI Assistant">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3l1.25 2.75L23 7l-2.75 1.25L19 11l-1.25-2.75L15 7l2.75-1.25L19 3zm-7.5.5L9 9 3.5 11.5 9 14l2.5 5.5L14 14l5.5-2.5L14 9 11.5 3.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
      </svg>
    </button>

    <aside id="ai-panel" class="ai-panel hidden" aria-label="CoinBot AI Assistant">
      <div class="ai-panel-header">
        <div class="ai-header-brand">
          <div class="ai-avatar-circle">✨</div>
          <div>
            <div class="ai-header-name">CoinBot</div>
            <div id="ai-header-sub" class="ai-header-sub">Smart Financial Co-Pilot</div>
          </div>
        </div>
        <div class="ai-header-actions">
          <button type="button" id="ai-memory-btn" class="ai-icon-btn" title="AI Learned Memory">🧠</button>
          <button type="button" id="ai-size-btn" class="ai-icon-btn" title="Toggle Half / Full Screen">⇕</button>
          <button type="button" id="ai-tts-btn" class="ai-icon-btn" title="Toggle Voice Readout">🔇</button>
          <button type="button" id="ai-reset-btn" class="ai-icon-btn" title="Reset Chat">↻</button>
          <button type="button" id="ai-close-btn" class="ai-icon-btn" title="Minimize">✕</button>
        </div>
      </div>

      <div id="ai-quick-chips" class="ai-quick-chips"></div>
      <div id="ai-messages" class="ai-messages"></div>

      <div id="ai-attachment-preview" class="ai-attachment-preview hidden"></div>

      <form id="ai-composer-form" class="ai-composer">
        <label for="ai-file-input" class="ai-attach-btn" title="Attach Screenshot, Photo, or CSV">+</label>
        <input type="file" id="ai-file-input" accept="image/*,.csv,.txt,.json" class="hidden" />
        <button type="button" id="ai-mic-btn" class="ai-mic-btn" title="Voice Input">🎤</button>
        <input type="text" id="ai-input" aria-label="Message CoinBot" placeholder="Ask CoinBot or say 'Add $120/wk Groceries'..." autocomplete="off" />
        <button type="submit" id="ai-send-btn" class="ai-send-btn" aria-label="Send message">➤</button>
      </form>
    </aside>

    <!-- Floating Bottom Navigation Pill Dock -->
    <nav id="bottom-dock" class="bottom-dock liquid-glass-pill" aria-label="Primary Navigation"></nav>
  </div>

  <!-- 5. Universal Modal Dialog Container -->
  <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>

  <!-- 6. Fullscreen Subscription & Leak Audit Command Center Overlay -->
  <div id="audit-modal-root" class="fullscreen-modal hidden" role="dialog" aria-modal="true"></div>

  <!-- 7. Toast Notification Banner -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
