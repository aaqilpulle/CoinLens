name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Adds a manual "Run workflow" button
  
jobs:
  build:
    name: Build APK and Upload to Release
    runs-on: ubuntu-latest

    # Required permissions to create releases and upload files
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug  # Change to assembleRelease if you are using a signed release build

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: automated-build-${{ github.run_number }}  # Automatically creates a unique tag for manual runs
          name: "Debug APK Build #${{ github.run_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
